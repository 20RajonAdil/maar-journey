<script>
(function(){
  var root=document.getElementById('maar-app-launcher');
  var btn=document.getElementById('maar-launcher-btn');
  if(!root||!btn)return;
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    var open=root.classList.toggle('open');
    btn.setAttribute('aria-expanded',open?'true':'false');
  });
  document.addEventListener('click',function(e){
    if(!root.contains(e.target)){
      root.classList.remove('open');
      btn.setAttribute('aria-expanded','false');
    }
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){root.classList.remove('open');btn.setAttribute('aria-expanded','false');}
  });
})();
</script>
